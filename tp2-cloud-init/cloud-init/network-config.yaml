# TP2 — network-config (format v2) — variante statique (exercice 6)
# L'interface est relevée dans la VM (--os-variant generic -> machine i440FX -> ens2)
# 192.168.122.200 est libre (aucun bail DHCP actif au moment du déploiement).
# Variante DHCP testée d'abord : ens2: { dhcp4: true }
version: 2
ethernets:
  ens2:
    dhcp4: false
    addresses: [192.168.122.200/24]
    routes:
      - to: default
        via: 192.168.122.1
    nameservers:
      addresses: [192.168.122.1, 1.1.1.1]
